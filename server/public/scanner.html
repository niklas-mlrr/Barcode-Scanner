<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Barcode Scanner</title>
  <script src="/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: 16px; opacity: 0.8; }
    #reader { position: relative; width: 100%; max-width: 320px; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 0px #4caf50; transition: box-shadow 0.6s ease-out; }
    #reader.scan-success { box-shadow: 0 0 0 5px #4caf50; transition: none; }
    #status {
      margin-top: 16px;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      background: #1e1e1e;
      width: 100%; max-width: 320px;
      text-align: center;
    }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: #888; }
    .dot.ok { background: #4caf50; }
    .dot.err { background: #f44336; }
    .controls {
      margin-top: 16px;
      display: grid;
      gap: 8px;
      width: 100%; max-width: 320px;
    }
    #camera-row { grid-template-columns: 1fr auto; }
    #sound-row  { grid-template-columns: 1fr 1fr; }
    button, select {
      width: 100%;
      padding: 12px 10px;
      border: none;
      border-radius: 8px;
      background: #2a2a2a;
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    button:hover, select:hover { background: #3a3a3a; }
    button:active { background: #4a4a4a; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .torch-on { background: #4caf50 !important; }
    .sound-on { background: #4caf50 !important; }
    #resend-btn { padding-top: 33px; padding-bottom: 33px; transition: background 0.2s, color 0.2s; }
    #resend-btn.sent { background: #4caf50; color: #fff; }
    #resend-btn .check { display: none; }
    #resend-btn.sent .label { display: none; }
    #resend-btn.sent .check { display: inline; }
    #reload-btn { padding: 12px 14px; font-size: 1.1rem; width: auto; }
    #manual-input {
      display: none;
      width: 100%;
      max-width: 320px;
      padding: 20px 16px;
      border: 2px solid #444;
      border-radius: 12px;
      background: #1e1e1e;
      color: #fff;
      font-size: 1.1rem;
      outline: none;
    }
    #manual-input:focus { border-color: #4caf50; }
    #manual-input.scan-success { border-color: #4caf50; box-shadow: 0 0 0 4px #4caf50; transition: none; }
    .manual-mode #reader { display: none; }
    .manual-mode #manual-input { display: block; }
    #enter-icon {
      width: 22px;
      height: 18px;
      fill: currentColor;
      vertical-align: middle;
      display: inline-block;
    }
    .manual-mode #torch-btn .torch-label { display: none; }
    .manual-mode #torch-btn .enter-label { display: inline-flex; align-items: center; gap: 6px; }
    #torch-btn .enter-label { display: none; }
    #focus-warning {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #f44336;
      color: #fff;
      padding: 12px;
      text-align: center;
      font-weight: 600;
      z-index: 100;
    }
    .show-warning #focus-warning { display: block; }
    #mode-select { width: 100%; }
  </style>
</head>
<body>
  <h1>Barcode Scanner</h1>
  <div id="reader"></div>
  <input id="manual-input" type="text" inputmode="text" autocomplete="off" placeholder="Barcode eingeben...">
  <div id="status"><span class="dot" id="dot"></span><span id="status-text">Connecting...</span></div>
  <div class="controls" id="resend-row">
    <button id="resend-btn" disabled><span class="label">Code erneut senden</span><span class="check">&#x2713; Erneut gesendet</span></button>
  </div>
  <div class="controls" id="mode-row">
    <select id="mode-select">
      <option value="camera" selected>Kamera</option>
      <option value="manual">Manuelle Eingabe</option>
    </select>
  </div>
  <div class="controls" id="camera-row">
    <select id="camera-select"><option>Loading cameras...</option></select>
    <button id="reload-btn" title="Reload camera">&#x21BA;</button>
  </div>
  <div class="controls" id="sound-row">
    <button id="sound-btn">Sound: off</button>
    <button id="torch-btn">
      <span class="torch-label">Light: off</span>
      <span class="enter-label">
        <svg id="enter-icon" viewBox="0 0 24 20">
          <path d="M2 2 V14 H16 L12 10 M16 14 L12 18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Eingeben
      </span>
    </button>
  </div>

  <script>
    const statusEl = document.getElementById('status-text');
    const dotEl = document.getElementById('dot');
    let ws;

    function connect() {
      ws = new WebSocket(`wss://${location.host}/`);
      ws.onopen = () => { dotEl.className = 'dot ok'; statusEl.textContent = 'Connected — ready to scan'; };
      ws.onclose = () => { dotEl.className = 'dot err'; statusEl.textContent = 'Disconnected — retrying...'; setTimeout(connect, 2000); };
      ws.onerror = () => { dotEl.className = 'dot err'; statusEl.textContent = 'Connection error'; };
    }
    connect();

    let lastValue = '', cooldown = false, html5QrCode = null, currentCameraId = null, isTorchOn = false, isCameraRunning = false, isRestarting = false, soundEnabled = false;
    let lastSentValue = '';
    const cameraSelect = document.getElementById('camera-select');
    const resendBtn = document.getElementById('resend-btn');
    const torchBtn = document.getElementById('torch-btn');
    const soundBtn = document.getElementById('sound-btn');
    const reloadBtn = document.getElementById('reload-btn');
    const readerEl = document.getElementById('reader');
    const modeSelect = document.getElementById('mode-select');
    const manualInput = document.getElementById('manual-input');
    const torchLabel = torchBtn.querySelector('.torch-label');
    const focusWarning = document.getElementById('focus-warning');
    let scanFlashTimeout = null;
    let mode = 'camera';

    let audioCtx = null, audioBuffer = null;

    async function initAudio() {
      if (audioBuffer) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      // Silent buffer to unlock iOS AudioContext during user gesture
      const silence = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
      const silSrc = audioCtx.createBufferSource();
      silSrc.buffer = silence; silSrc.connect(audioCtx.destination); silSrc.start(0);
      await audioCtx.resume();
      const response = await fetch('/beep.mp3');
      const arrayBuf = await response.arrayBuffer();
      audioBuffer = await audioCtx.decodeAudioData(arrayBuf);
    }

    function playBeep() {
      if (!audioCtx || !audioBuffer) return;
      const src = audioCtx.createBufferSource();
      src.buffer = audioBuffer;
      src.connect(audioCtx.destination);
      src.start(0);
    }

    soundBtn.addEventListener('click', async () => {
      soundEnabled = !soundEnabled;
      if (soundEnabled) {
        soundBtn.textContent = 'Sound: on';
        soundBtn.classList.add('sound-on');
        await initAudio();
        playBeep();
      } else {
        soundBtn.textContent = 'Sound: off';
        soundBtn.classList.remove('sound-on');
      }
    });



    function flashScan() {
      if (navigator.vibrate) navigator.vibrate(80);
      const target = mode === 'manual' ? manualInput : readerEl;
      target.classList.add('scan-success');
      clearTimeout(scanFlashTimeout);
      scanFlashTimeout = setTimeout(() => target.classList.remove('scan-success'), 1600);
    }

    function onScanSuccess(value) {
      if (cooldown || value === lastValue) return;
      if (soundEnabled) playBeep();
      lastValue = value; cooldown = true;
      lastSentValue = value;
      resendBtn.disabled = false;
      setTimeout(() => { cooldown = false; lastValue = ''; }, 2000);
      statusEl.textContent = 'Sent: ' + value;
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'scan', value }));
      flashScan();
      resendBtn.classList.remove('sent');
    }

    function updateTorchButtonUI() {
      if (mode === 'manual') {
        torchBtn.classList.remove('torch-on');
        torchBtn.disabled = false;
        return;
      }
      torchLabel.textContent = isTorchOn ? 'Light: on' : 'Light: off';
      torchBtn.classList.toggle('torch-on', isTorchOn);
    }

    async function setTorchOff() {
      if (!isTorchOn) return;
      const video = document.querySelector('#reader video');
      const track = video?.srcObject?.getVideoTracks?.()[0];
      if (track) {
        try { await track.applyConstraints({ advanced: [{ torch: false }] }); } catch (e) {}
      }
      isTorchOn = false;
      updateTorchButtonUI();
    }

    async function stopCamera() {
      if (html5QrCode) {
        try { await html5QrCode.stop(); } catch (e) {}
        try { html5QrCode.clear(); } catch (e) {}
        html5QrCode = null;
      }
      isCameraRunning = false;
      currentCameraId = null;
    }

    function updateFocusWarning() {
      if (mode !== 'manual') {
        document.body.classList.remove('show-warning');
        return;
      }
      const focused = document.activeElement === manualInput;
      document.body.classList.toggle('show-warning', !focused);
    }

    function sendManualValue() {
      const value = manualInput.value.trim();
      if (!value) return;
      if (soundEnabled) playBeep();
      lastSentValue = value;
      resendBtn.disabled = false;
      statusEl.textContent = 'Sent: ' + value;
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'scan', value }));
      flashScan();
      resendBtn.classList.remove('sent');
      manualInput.value = '';
      manualInput.focus();
      updateFocusWarning();
    }

    async function setMode(newMode) {
      mode = newMode;
      document.body.classList.toggle('manual-mode', mode === 'manual');
      if (mode === 'manual') {
        cameraSelect.disabled = true;
        reloadBtn.disabled = true;
        await setTorchOff();
        await stopCamera();
        manualInput.value = '';
        updateTorchButtonUI();
        manualInput.focus();
        updateFocusWarning();
        statusEl.textContent = ws && ws.readyState === WebSocket.OPEN ? 'Manuelle Eingabe bereit' : 'Reconnecting...';
      } else {
        cameraSelect.disabled = false;
        reloadBtn.disabled = false;
        document.body.classList.remove('show-warning');
        updateTorchButtonUI();
        const selectedId = cameraSelect.value;
        if (selectedId && !cameraSelect.options[cameraSelect.selectedIndex]?.text?.includes('No cameras found')) {
          currentCameraId = selectedId;
          initScanner(selectedId);
        }
      }
    }

    // Resend last scanned code
    resendBtn.addEventListener('click', () => {
      if (!lastSentValue) return;
      if (soundEnabled) playBeep();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'scan', value: lastSentValue }));
        statusEl.textContent = 'Sent: ' + lastSentValue;
        flashScan();
        resendBtn.classList.add('sent');
      } else {
        statusEl.textContent = 'Not connected — cannot resend';
      }
    });

    // Load available cameras
    Html5Qrcode.getCameras().then(cameras => {
      const preferred =
        cameras.find(c => /back dual wide/i.test(c.label)) ||
        cameras.find(c => /back/i.test(c.label)) ||
        cameras[0];
      cameraSelect.innerHTML = cameras.map(c => `<option value="${c.id}" ${c === preferred ? 'selected' : ''}>${c.label}</option>`).join('');
      currentCameraId = preferred?.id;
      if (mode === 'camera') initScanner(currentCameraId);
    }).catch(err => {
      cameraSelect.innerHTML = '<option>No cameras found</option>';
      cameraSelect.disabled = true;
    });

    async function initScanner(cameraId) {
      if (isRestarting) return;
      isRestarting = true;
      isCameraRunning = false;
      reloadBtn.disabled = true;
      reloadBtn.textContent = '...';
      statusEl.textContent = 'Starting camera...';

      if (html5QrCode) {
        try { await html5QrCode.stop(); } catch (e) {}
        try { html5QrCode.clear(); } catch (e) {}
        html5QrCode = null;
      }

      html5QrCode = new Html5Qrcode('reader');
      try {
        await html5QrCode.start(
          cameraId,
          { fps: 15, qrbox: { width: 240, height: 160 }, aspectRatio: 1.0 },
          onScanSuccess,
          () => {}
        );
        isCameraRunning = true;
        currentCameraId = cameraId;
        isTorchOn = false;
        updateTorchButtonUI();
        statusEl.textContent = ws && ws.readyState === WebSocket.OPEN ? 'Connected — ready to scan' : 'Reconnecting...';
        const video = document.querySelector('#reader video');
        if (video && video.srcObject) {
          const track = video.srcObject.getVideoTracks()[0];
          const capabilities = track.getCapabilities?.();
          torchBtn.disabled = !(capabilities && capabilities.torch);
        }
      } catch (err) {
        console.error('Camera error:', err);
        statusEl.textContent = 'Camera error — tap ↺ to retry';
        dotEl.className = 'dot err';
      }

      reloadBtn.textContent = '↺';
      reloadBtn.disabled = false;
      isRestarting = false;
    }

    // Camera selector change
    cameraSelect.addEventListener('change', () => {
      initScanner(cameraSelect.value);
      isTorchOn = false;
      updateTorchButtonUI();
    });

    // Torch toggle / manual enter button
    torchBtn.addEventListener('click', async () => {
      if (mode === 'manual') {
        sendManualValue();
        return;
      }
      const video = document.querySelector('#reader video');
      if (!video || !video.srcObject) return;
      const track = video.srcObject.getVideoTracks()[0];
      if (!track) return;
      try {
        await track.applyConstraints({ advanced: [{ torch: !isTorchOn }] });
        isTorchOn = !isTorchOn;
        updateTorchButtonUI();
      } catch (e) {
        console.log('Torch not supported');
      }
    });

    // Reload camera button (always visible)
    reloadBtn.addEventListener('click', () => {
      if (currentCameraId) initScanner(currentCameraId);
    });

    // Mode selector
    modeSelect.addEventListener('change', () => {
      setMode(modeSelect.value);
    });

    // Manual input
    manualInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendManualValue();
      }
    });
    manualInput.addEventListener('focus', updateFocusWarning);
    manualInput.addEventListener('blur', updateFocusWarning);

    // Auto-restart camera when phone wakes from standby
    document.addEventListener('visibilitychange', () => {
      if (mode !== 'camera') return;
      if (!document.hidden && currentCameraId) {
        setTimeout(() => initScanner(currentCameraId), 300);
      }
    });

    // Fallback: detect frozen/black video and auto-restart
    setInterval(() => {
      if (mode !== 'camera' || document.hidden || isRestarting || !currentCameraId) return;
      const video = document.querySelector('#reader video');
      if (video && (video.paused || video.ended || video.readyState < 2)) {
        initScanner(currentCameraId);
      }
    }, 3000);
  </script>
  <div id="focus-warning">Vorsicht: Eingabefeld nicht fokussiert!</div>
</body>
</html>
